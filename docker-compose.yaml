services:
  notask:
    # Nom et tag explicites de l'image construite localement.
    image: 'notask:latest'
    # Sans cette ligne, Coolify tenterait de tirer notask:latest depuis
    # Docker Hub, où elle n'existe pas. On force la construction.
    pull_policy: build
    # Déploiement en Service Coolify : aucun dépôt n'est cloné localement,
    # c'est Docker qui va chercher le code sur GitHub au moment du build.
    # Nécessite un dépôt public.
    build: 'https://github.com/oweebee/notask.git#main'
    restart: unless-stopped
    expose:
      - '8111'
    environment:
      NOTASK_DATA_DIR: /data
    volumes:
      - 'notask_data:/data'
    healthcheck:
      test:
        - CMD
        - curl
        - '-fsS'
        - 'http://127.0.0.1:8111/health'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  notask_data: null
