services:
  notask:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '8111'
    environment:
      NOTASK_DATA_DIR: /data
    volumes:
      - 'notask_data:/data'
    healthcheck:
      test:
        - CMD
        - curl
        - '-fsS'
        - 'http://127.0.0.1:8111/health'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  notask_data: null
