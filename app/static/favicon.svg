<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 25 20">
  <!-- Cuillère jaune, viewBox resserré autour de la forme pour occuper
       toute la hauteur disponible du favicon (l'ancienne version gardait
       une grande marge verticale interne). -->
  <g>
    <ellipse cx="5.5" cy="7" rx="5.5" ry="6.5" fill="#ffd54f"/>
    <ellipse cx="5.5" cy="6.6" rx="3.4" ry="4.2" fill="#ffe082"/>
    <rect x="3.8" y="12" width="3.4" height="7.6" rx="1.7" fill="#ffd54f"/>
  </g>
  <!-- Cuillère bleue, juste à côté -->
  <g>
    <ellipse cx="19.5" cy="7" rx="5.5" ry="6.5" fill="#42a5f5"/>
    <ellipse cx="19.5" cy="6.6" rx="3.4" ry="4.2" fill="#90caf9"/>
    <rect x="17.8" y="12" width="3.4" height="7.6" rx="1.7" fill="#42a5f5"/>
  </g>
</svg>
