  <rect x="3.5" y="11" width="3" height="8" rx="1.5" fill="#ffd54f"/>
  <ellipse cx="15" cy="6" rx="5" ry="6" fill="#42a5f5"/>
  <rect x="13.5" y="11" width="3" height="8" rx="1.5" fill="#42a5f5"/>
</svg>
